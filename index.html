<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>集中タイマー</title>

<!-- ── PWA設定 ── -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f0e0c">
<meta name="description" content="ポモドーロ式の集中・休憩サイクルタイマー">

<!-- iOS用 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="集中タイマー">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --focus: #c8a96e;
    --rest: #6ec8a9;
    --bg: #0f0e0c;
    --surface: #1a1815;
    --border: #2a2620;
    --text: #e8e0d0;
    --muted: #6a6055;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  /* ── COMPACT WIDGET ── */
  .widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 180px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    transition: all 0.3s ease;
    z-index: 999;
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  .widget.expanded {
    width: 300px;
    bottom: 20px;
    right: 20px;
  }
  .widget.dragging { cursor: grabbing; box-shadow: 0 16px 48px rgba(0,0,0,0.7); }

  /* Header row */
  .widget-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .mode-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--focus);
    flex-shrink: 0;
    transition: background 0.8s;
    box-shadow: 0 0 6px var(--focus);
  }
  .rest-mode .mode-dot { background: var(--rest); box-shadow: 0 0 6px var(--rest); }

  .mode-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    flex: 1;
  }

  .expand-btn {
    background: none; border: none;
    color: var(--muted); font-size: 14px;
    cursor: pointer; padding: 0;
    line-height: 1;
    transition: color 0.2s;
  }
  .expand-btn:hover { color: var(--text); }

  /* Time display */
  .time-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .time-big {
    font-family: 'DM Mono', monospace;
    font-size: 36px;
    font-weight: 300;
    line-height: 1;
    color: var(--focus);
    transition: color 0.8s;
    letter-spacing: -0.02em;
  }
  .rest-mode .time-big { color: var(--rest); }

  .cycle-info {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 2px;
  }

  /* Progress bar */
  .progress-bar {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--focus);
    border-radius: 2px;
    transition: width 1s linear, background 0.8s;
    width: 100%;
  }
  .rest-mode .progress-fill { background: var(--rest); }

  /* Control buttons */
  .controls {
    display: flex;
    gap: 6px;
  }

  .btn-start {
    flex: 1;
    background: var(--focus);
    border: none;
    border-radius: 10px;
    color: var(--bg);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 9px 0;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-start:active { opacity: 0.75; transform: scale(0.97); }
  .rest-mode .btn-start { background: var(--rest); }

  .btn-icon {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-size: 13px;
    width: 34px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-icon:active { border-color: var(--text); color: var(--text); }

  /* ── EXPANDED: Settings ── */
  .settings-panel {
    display: none;
    flex-direction: column;
    gap: 12px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .expanded .settings-panel { display: flex; }

  .presets {
    display: flex; gap: 5px; flex-wrap: wrap;
  }
  .preset-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    padding: 4px 8px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }
  .preset-btn.active, .preset-btn:hover {
    border-color: var(--focus);
    color: var(--focus);
    background: rgba(200,169,110,0.08);
  }

  .inputs {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
  }
  .input-group { display: flex; flex-direction: column; gap: 4px; }
  .input-group label {
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .input-group input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 16px;
    font-weight: 300;
    padding: 7px 6px;
    width: 100%;
    text-align: center;
    outline: none;
  }
  .input-group input:focus { border-color: var(--focus); }

  /* Log */
  .log-panel {
    display: none;
    flex-direction: column;
    gap: 3px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
    max-height: 80px;
    overflow-y: auto;
  }
  .expanded .log-panel { display: flex; }
  .log-entry {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    display: flex; gap: 8px;
  }
  .log-time { color: var(--focus); }
  .log-entry.rest .log-time { color: var(--rest); }

  /* Dots */
  .dots {
    display: flex; gap: 4px; justify-content: center;
  }
  .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--border);
    transition: background 0.4s;
  }
  .dot.done { background: var(--focus); opacity: 0.5; }
  .dot.current { background: var(--focus); box-shadow: 0 0 5px var(--focus); }
  .rest-mode .dot.done { background: var(--rest); }
  .rest-mode .dot.current { background: var(--rest); box-shadow: 0 0 5px var(--rest); }

  /* Pulse animation while running */
  @keyframes subtlePulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .running .time-big { animation: subtlePulse 2s ease-in-out infinite; }

  /* Background hint */
  .bg-hint {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    opacity: 0.03;
    font-size: 30vw;
    font-family: 'DM Mono', monospace;
    font-weight: 300;
    color: var(--focus);
    transition: color 1s;
    user-select: none;
  }
</style>
</head>
<body>

<div class="bg-hint" id="bgHint">⏱</div>

<div class="widget" id="widget">

  <!-- Compact header -->
  <div class="widget-header">
    <div class="mode-dot"></div>
    <div class="mode-label" id="modeLabel">集中</div>
    <button class="expand-btn" id="expandBtn" onclick="toggleExpand()">⚙</button>
  </div>

  <!-- Time -->
  <div class="time-row">
    <div class="time-big" id="timeBig">25:00</div>
    <div class="cycle-info" id="cycleInfo">1/4</div>
  </div>

  <!-- Progress -->
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- Dots -->
  <div class="dots" id="dots"></div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn-icon" onclick="resetTimer()" title="リセット">↺</button>
    <button class="btn-start" id="startBtn" onclick="toggleTimer()">スタート</button>
    <button class="btn-icon" onclick="skipPhase()" title="スキップ">▶▶</button>
  </div>

  <!-- Settings (expanded) -->
  <div class="settings-panel">
    <div class="presets">
      <button class="preset-btn" onclick="applyPreset(25,5,4,this)">25/5</button>
      <button class="preset-btn" onclick="applyPreset(10,1,6,this)">10/1</button>
      <button class="preset-btn" onclick="applyPreset(50,10,3,this)">50/10</button>
      <button class="preset-btn" onclick="applyPreset(15,3,4,this)">15/3</button>
    </div>
    <div class="inputs">
      <div class="input-group">
        <label>集中(分)</label>
        <input type="number" id="focusMin" value="25" min="1" max="120" onchange="onSettingChange()">
      </div>
      <div class="input-group">
        <label>休憩(分)</label>
        <input type="number" id="restMin" value="5" min="1" max="60" onchange="onSettingChange()">
      </div>
      <div class="input-group">
        <label>回数</label>
        <input type="number" id="cycles" value="4" min="1" max="20" onchange="onSettingChange()">
      </div>
    </div>
  </div>

  <!-- Log (expanded) -->
  <div class="log-panel" id="logPanel"></div>

</div>

<script>
// ── Audio ──
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(type) {
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();

    if (type === 'start') {
      // 作業開始：軽やかな上昇音
      playNote(ctx, 440, 0.0, 0.08, 'sine');
      playNote(ctx, 550, 0.1, 0.08, 'sine');
      playNote(ctx, 660, 0.2, 0.15, 'sine');
    } else if (type === 'end') {
      // 作業終了：ほっとする下降音
      playNote(ctx, 660, 0.0, 0.1, 'sine');
      playNote(ctx, 550, 0.12, 0.1, 'sine');
      playNote(ctx, 440, 0.24, 0.2, 'sine');
    } else if (type === 'restEnd') {
      // 休憩終了：背筋を伸ばすような短い音
      playNote(ctx, 520, 0.0, 0.06, 'triangle');
      playNote(ctx, 780, 0.08, 0.12, 'triangle');
    } else if (type === 'complete') {
      // 全完了：嬉しいファンファーレ
      playNote(ctx, 440, 0.0, 0.1, 'sine');
      playNote(ctx, 550, 0.12, 0.1, 'sine');
      playNote(ctx, 660, 0.24, 0.1, 'sine');
      playNote(ctx, 880, 0.36, 0.25, 'sine');
    }
  } catch(e) { /* audio not supported */ }
}

function playNote(ctx, freq, delay, duration, type) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.value = freq;
  const t = ctx.currentTime + delay;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.18, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.start(t);
  osc.stop(t + duration + 0.05);
}

// ── State ──
let st = {
  focusSec: 25 * 60,
  restSec:  5 * 60,
  totalCycles: 4,
  currentCycle: 1,
  isRest: false,
  remaining: 25 * 60,
  running: false,
  interval: null,
};

function fmt(s) {
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

function updateUI() {
  const w = document.getElementById('widget');
  w.className = 'widget' + (st.isRest ? ' rest-mode' : ' focus-mode') + (st.running ? ' running' : '') + (isExpanded ? ' expanded' : '');

  document.getElementById('modeLabel').textContent = st.isRest ? '休憩' : '集中';
  document.getElementById('timeBig').textContent = fmt(st.remaining);
  document.getElementById('cycleInfo').textContent = `${st.currentCycle}/${st.totalCycles}`;
  document.getElementById('startBtn').textContent = st.running ? '一時停止' : (st.remaining === (st.isRest ? st.restSec : st.focusSec) ? 'スタート' : '再開');

  const total = st.isRest ? st.restSec : st.focusSec;
  document.getElementById('progressFill').style.width = (st.remaining / total * 100) + '%';

  renderDots();
  document.title = fmt(st.remaining) + (st.isRest ? ' 休憩' : ' 集中');
}

function renderDots() {
  const wrap = document.getElementById('dots');
  wrap.innerHTML = '';
  for (let i = 1; i <= st.totalCycles; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < st.currentCycle ? ' done' : i === st.currentCycle ? ' current' : '');
    wrap.appendChild(d);
  }
}

function addLog(msg, isRest) {
  const p = document.getElementById('logPanel');
  const now = new Date();
  const t = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const e = document.createElement('div');
  e.className = 'log-entry' + (isRest ? ' rest' : '');
  e.innerHTML = `<span class="log-time">${t}</span><span>${msg}</span>`;
  p.insertBefore(e, p.firstChild);
}

function toggleTimer() {
  // Resume AudioContext on first user interaction
  if (!audioCtx) getAudioCtx();

  if (st.running) {
    clearInterval(st.interval);
    st.running = false;
    releaseWakeLock();
  } else {
    if (!st.isRest) playTone('start');
    st.running = true;
    st.interval = setInterval(tick, 1000);
    requestWakeLock();
  }
  updateUI();
}

function tick() {
  st.remaining--;
  if (st.remaining <= 0) phaseEnd();
  else updateUI();
}

function phaseEnd() {
  if (!st.isRest) {
    playTone('end');
    addLog(`集中 ${document.getElementById('focusMin').value}分 完了 ✓`, false);
    if (st.currentCycle >= st.totalCycles) {
      clearInterval(st.interval);
      st.running = false;
      playTone('complete');
      addLog(`全${st.totalCycles}サイクル完了 🎉`, false);
      document.getElementById('startBtn').textContent = 'もう一度';
      document.getElementById('timeBig').textContent = '完了！';
      updateUI();
      return;
    }
    st.isRest = true;
    st.remaining = st.restSec;
  } else {
    playTone('restEnd');
    addLog(`休憩 ${document.getElementById('restMin').value}分 完了`, true);
    st.isRest = false;
    st.currentCycle++;
    st.remaining = st.focusSec;
    playTone('start');
  }
  updateUI();
}

function skipPhase() {
  clearInterval(st.interval);
  st.running = false;
  phaseEnd();
}

function resetTimer() {
  clearInterval(st.interval);
  st.running = false;
  st.currentCycle = 1;
  st.isRest = false;
  st.remaining = st.focusSec;
  updateUI();
}

function applyPreset(f, r, c, btn) {
  document.getElementById('focusMin').value = f;
  document.getElementById('restMin').value = r;
  document.getElementById('cycles').value = c;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  onSettingChange();
}

function onSettingChange() {
  st.focusSec = parseInt(document.getElementById('focusMin').value) * 60 || 1500;
  st.restSec  = parseInt(document.getElementById('restMin').value)  * 60 || 300;
  st.totalCycles = parseInt(document.getElementById('cycles').value) || 4;
  resetTimer();
}

// ── Expand/Collapse ──
let isExpanded = false;
function toggleExpand() {
  isExpanded = !isExpanded;
  document.getElementById('expandBtn').textContent = isExpanded ? '✕' : '⚙';
  updateUI();
}

// ── Drag to reposition ──
const widget = document.getElementById('widget');
let drag = { active: false, offX: 0, offY: 0 };

function startDrag(cx, cy) {
  const r = widget.getBoundingClientRect();
  // offX/offY = pointer position relative to widget's top-left
  drag = { active: true, offX: cx - r.left, offY: cy - r.top };
  widget.classList.add('dragging');
  widget.style.right = 'auto';
  widget.style.bottom = 'auto';
  widget.style.left = r.left + 'px';
  widget.style.top  = r.top  + 'px';
}

function moveDrag(cx, cy) {
  if (!drag.active) return;
  // Widget top-left follows pointer minus the grab offset — instant, no lag
  widget.style.left = (cx - drag.offX) + 'px';
  widget.style.top  = (cy - drag.offY) + 'px';
}

function endDrag() {
  if (!drag.active) return;
  drag.active = false;
  widget.classList.remove('dragging');
}

widget.addEventListener('mousedown', e => {
  if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
  startDrag(e.clientX, e.clientY);
});
document.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
document.addEventListener('mouseup', endDrag);

widget.addEventListener('touchstart', e => {
  if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
  const t = e.touches[0];
  startDrag(t.clientX, t.clientY);
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!drag.active) return;
  const t = e.touches[0];
  moveDrag(t.clientX, t.clientY);
}, { passive: true });
document.addEventListener('touchend', endDrag);

// Init
updateUI();

// ── Service Worker 登録（オフライン対応） ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('オフライン対応: 有効'))
      .catch(err => console.log('SW登録失敗:', err));
  });
}

// ── 画面スリープ防止（対応ブラウザのみ） ──
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { /* 非対応 */ }
}
async function releaseWakeLock() {
  try { if (wakeLock) { await wakeLock.release(); wakeLock = null; } } catch(e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && st.running) requestWakeLock();
});
</script>
</body>
</html>
